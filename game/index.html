<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmara Undertow — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101018; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Fixed 1280x800 logical stage, scaled to fit the window keeping aspect.
     Two stacked canvases: #gl (WebGL 3D world) below, #game (2D HUD /
     menus / dialog overlay, and the whole game in ?flat=1 fallback) above. */
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  #stage canvas {
    position: absolute; inset: 0;
    display: block; touch-action: none;
    width: 100%; height: 100%;
  }
  #game { background: transparent; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1280" height="800" aria-hidden="true"></canvas>
  <canvas id="game" width="1280" height="800" aria-label="Solmara Undertow: explore the city of Solmara on foot and by car, complete story missions, and outrun the police. WASD to move, E to enter cars, F to punch, mouse to aim and click to shoot."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
